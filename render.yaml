# Render service definition for the hosted demo.
#
# The plan matters. torch, the cross-encoder, the embedding model and a
# 14,726-chunk index need roughly 1.5 GB resident; anything smaller than a
# 2 GB instance is killed during startup rather than failing with a useful
# message. `starter` will not work.
services:
  - type: web
    name: grounded-factcheck
    runtime: docker
    plan: standard          # 2 GB RAM. See note above before lowering this.
    region: ohio
    healthCheckPath: /_stcore/health
    envVars:
      # Generation only. Retrieval and verification stay local to the container.
      - key: OPENAI_API_KEY
        sync: false         # set it in the Render dashboard, never in this file
      - key: FOGA_LLM_PROVIDER
        value: openai
      - key: FOGA_LLM_MODEL
        value: gpt-5.6-luna
